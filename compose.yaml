services:
  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    ports:
      - "${DRAIQ_BIND_HOST:-0.0.0.0}:${DRAIQ_HTTP_PORT:-8010}:8010"
    restart: unless-stopped
    depends_on: [api]
  api:
    build:
      context: .
      dockerfile: docker/server.Dockerfile
    ports:
      - "${DRAIQ_API_BIND_HOST:-127.0.0.1}:${DRAIQ_API_PORT:-8011}:8011"
    restart: unless-stopped
